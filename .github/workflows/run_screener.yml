name: 每日自動更新選股儀表板

on:
  schedule:
    # 每天台股盤後 16:30 (UTC 時間 08:30) 自動執行
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動按按鈕執行

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行選股分析
        run: python screener.py

      - name: 自動將最新的 data.json 儲存回專案
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto update stock data [skip ci]" || exit 0
          git push
